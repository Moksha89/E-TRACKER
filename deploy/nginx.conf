server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25M;

    # Static landing page + APK download
    root /var/www/etracker;
    index index.html;

    # Public APK at /download/etracker.apk
    location = /download/etracker.apk {
        alias /var/www/etracker/etracker.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="etracker.apk"';
    }

    # Landing page at /
    location = / {
        try_files /index.html =404;
    }

    # API + everything else proxies to FastAPI
    location ~ ^/(v1|healthz|docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

